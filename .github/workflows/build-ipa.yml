name: Build Flydigi PlayTogether IPA & Dylib for ESign

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned Standalone IPA
        run: |
          xcodebuild clean build \
            -project FlydigiPlayTogetherMapper.xcodeproj \
            -scheme FlydigiPlayTogetherMapper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/FlydigiPlayTogetherMapper.app Payload/
          zip -r9 FlydigiPlayTogetherMapper.ipa Payload

      - name: Build In-Game Touch Mapper Dylib (For ESign Inject)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -fobjc-arc \
            -mios-version-min=15.0 \
            -framework UIKit \
            -framework Foundation \
            -framework GameController \
            -framework CoreBluetooth \
            Sources/InjectDylib/FlydigiPTInject.m \
            -o FlydigiPTInject.dylib

      - name: Upload IPA & Dylib Artifacts for ESign
        uses: actions/upload-artifact@v4
        with:
          name: Flydigi-PlayTogether-ESign-Package
          path: |
            FlydigiPlayTogetherMapper.ipa
            FlydigiPTInject.dylib
